[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2word"
dynamic = ["version"]
description = "Reproducible LaTeX to Microsoft Word conversion tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "lxml>=5.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
latex2word = "latex2word.cli:main"

[tool.setuptools.dynamic]
version = { attr = "latex2word.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latex2word = ["py.typed", "schemas/*.json", "profiles/*.yaml", "filters/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: exercises the real machine toolchain; deselected by default (run with -m integration)",
]
